# Pusula CRM — yerel PostgreSQL
# Başlat:  docker compose up -d
# Durdur:  docker compose down          (veriler korunur)
# Sıfırla: docker compose down -v       (TÜM veriler silinir; açılışta örnek veriler yeniden yüklenir)
#
# Not: Bilgisayarda 5432'yi kullanan başka bir PostgreSQL olduğu için dışarıya 5433 açılır.

services:
  db:
    image: postgres:16-alpine
    container_name: pusulacrm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pusulacrm
      POSTGRES_USER: pusula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pusula_dev}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pusulacrm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pusula -d pusulacrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pusulacrm-data:
